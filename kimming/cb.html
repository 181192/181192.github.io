<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tilbake til Kimming · Kalli</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="main" class="shell">
    <section aria-labelledby="h">
      <p class="mark" aria-hidden="true">kalli<span>.</span></p>
      <h1 id="h">Innloggingen er ferdig.</h1>
      <p class="lede">Kopier adressen under og lim den inn i Kimming, under «Lim inn adressen du kom til etter BankID».</p>
      <p><textarea id="url" readonly rows="4" style="width:100%;font:inherit;font-size:.85rem" aria-label="Adressen som skal limes inn i Kimming"></textarea></p>
      <p><button id="copy" type="button" style="font:inherit;padding:.6rem 1rem">Kopier adressen</button> <span id="done" role="status"></span></p>
      <p>Adressen inneholder en engangskode som bare virker i noen minutter, og bare sammen med nøkkelen på telefonen din. Denne siden sender den ingen steder.</p>
    </section>
  </main>
  <script>
    var box = document.getElementById('url');
    box.value = location.href;
    document.getElementById('copy').addEventListener('click', function () {
      var done = document.getElementById('done');
      function ok() { done.textContent = 'Kopiert. Gå tilbake til Kimming.'; }
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(ok, function () { box.select(); });
      else { box.select(); document.execCommand('copy'); ok(); }
    });
  </script>
</body>
</html>
